name: Build macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create spec file
        run: |
          cat > build_macos.spec << 'SPEC'
          # -*- mode: python ; coding: utf-8 -*-
          block_cipher = None
          a = Analysis(
              ['main.py'],
              pathex=[],
              binaries=[],
              datas=[],
              hiddenimports=[
                  'matplotlib.backends.backend_agg',
                  'pystray._darwin',
              ],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=['pytest', 'unittest', 'test', 'tests'],
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              cipher=block_cipher,
              noarchive=False,
          )
          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.zipfiles,
              a.datas,
              [],
              name='GitHubTrendsWatch',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              upx_exclude=[],
              runtime_tmpdir=None,
              console=False,
              disable_windowed_traceback=False,
              icon=None,
          )
          SPEC

      - name: Build with PyInstaller
        run: python -m PyInstaller build_macos.spec --clean --noconfirm

      - name: Compute SHA256
        run: |
          shasum -a 256 dist/GitHubTrendsWatch > dist/GitHubTrendsWatch.sha256
          cat dist/GitHubTrendsWatch.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitHubTrendsWatch-macos
          path: |
            dist/GitHubTrendsWatch
            dist/GitHubTrendsWatch.sha256
